<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#00ffc8"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="English Duel"/>
  <link rel="manifest" href="manifest.json"/>
  <title>English Duel</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&subset=latin,latin-ext&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{height:100%;background:#080c14}body{background:#080c14;overflow-y:auto}
    body{font-family:'Inter',sans-serif;color:#e8eaf6;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:max(env(safe-area-inset-top,16px),16px) 16px max(env(safe-area-inset-bottom,16px),16px);overflow-x:hidden;position:relative}
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,200,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,200,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    .bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(120px);pointer-events:none;opacity:.1;z-index:0}
    .bg-glow-1{background:#00ffc8;top:-200px;left:-200px}
    .bg-glow-2{background:#7c4dff;bottom:-200px;right:-200px}
    #app{width:100%;max-width:520px;position:relative;z-index:1;padding-top:4px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 16px;backdrop-filter:blur(10px);animation:fadeUp .3s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .logo{font-family:'Orbitron',sans-serif;font-size:clamp(1.4rem,5vw,1.9rem);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#00ffc8,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:4px}
    .logo-sub{text-align:center;color:rgba(255,255,255,.3);font-size:.68rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
    .lbl{font-size:.67rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.36);margin-bottom:7px}
    .sec-title{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.32);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
    .sec-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
    input[type=text],input[type=password],textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:10px;padding:12px 15px;font-family:'Inter',sans-serif;font-size:.9rem;color:#fff;outline:none;margin-bottom:14px;transition:border-color .2s;-webkit-appearance:none;resize:vertical}
    textarea{min-height:90px;font-size:.77rem;line-height:1.5}
    input:focus,textarea:focus{border-color:#00ffc8}
    input::placeholder,textarea::placeholder{color:rgba(255,255,255,.18)}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:1px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;display:block}
    .btn+.btn,.btn+.google-btn,.google-btn+.btn{margin-top:9px}
    .btn-primary{background:linear-gradient(135deg,#00ffc8,#00b894);color:#080c14}
    .btn-primary:active{transform:scale(.98)}
    .btn-primary:disabled{opacity:.35;cursor:not-allowed}
    .btn-coop{background:linear-gradient(135deg,#7c4dff,#5e35b1);color:#fff}
    .btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.11);color:rgba(255,255,255,.42)}
    .btn-danger{background:transparent;border:1.5px solid rgba(255,82,82,.25);color:#ff8a80}

    /* Google sign-in button */
    .google-btn{width:100%;padding:14px 20px;background:#fff;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:.95rem;color:#1f1f1f;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .18s;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 16px rgba(0,0,0,.3)}
    .google-btn:active{transform:scale(.98);background:#f5f5f5}
    .google-btn:disabled{opacity:.4;cursor:not-allowed}
    .google-icon{width:22px;height:22px;flex-shrink:0}

    .info-box{background:rgba(0,255,200,.04);border:1px solid rgba(0,255,200,.16);border-radius:11px;padding:12px 14px;font-size:.79rem;color:rgba(255,255,255,.48);line-height:1.55;margin-bottom:14px}
    .info-box a{color:#00ffc8;text-decoration:none}
    .info-box strong{color:rgba(255,255,255,.72)}
    .err-box{background:rgba(255,82,82,.07);border:1px solid rgba(255,82,82,.2);border-radius:11px;padding:11px 14px;color:#ff8a80;font-size:.81rem;margin-bottom:13px;text-align:center}
    .warn-box{background:rgba(255,179,0,.06);border:1px solid rgba(255,179,0,.2);border-radius:11px;padding:11px 14px;color:#ffb300;font-size:.8rem;margin-bottom:13px}

    /* Auth screen */
    .auth-hero{text-align:center;padding:10px 0 24px}
    .auth-icon{font-size:3.5rem;margin-bottom:12px}
    .auth-title{font-size:1rem;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:6px}
    .auth-sub{font-size:.8rem;color:rgba(255,255,255,.35);line-height:1.4}
    .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:rgba(255,255,255,.2);font-size:.75rem}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
    .user-chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;margin-bottom:16px}
    .user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00ffc8,#7c4dff);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#080c14;flex-shrink:0;overflow:hidden}
    .user-avatar img{width:100%;height:100%;object-fit:cover}
    .user-info{flex:1;min-width:0}
    .user-name{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .user-email{font-size:.73rem;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Rank badge */
    .rank-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;border:1.5px solid;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:1px}

    /* Meta row */
    .meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
    .streak-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.25);border-radius:20px;font-size:.76rem;font-weight:600;color:#ff6b35;white-space:nowrap}
    .streak-num{font-family:'Orbitron',sans-serif;font-size:.88rem;font-weight:900}
    .shield-active{display:flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(0,255,200,.1);border:1px solid rgba(0,255,200,.3);border-radius:20px;font-size:.78rem;color:#00ffc8;font-weight:600;animation:shieldPulse 2s ease-in-out infinite}
    @keyframes shieldPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,200,.3)}50%{box-shadow:0 0 0 6px rgba(0,255,200,0)}}
    .shield-progress{display:flex;align-items:center;gap:5px;padding:5px 11px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:20px;font-size:.75rem;color:rgba(255,255,255,.4)}
    .shield-pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.15)}
    .shield-pip.filled{background:#00ffc8}
    .diff-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.67rem;letter-spacing:1px;text-transform:uppercase;font-weight:600}
    .diff-1{background:rgba(102,187,106,.1);color:#66bb6a;border:1px solid rgba(102,187,106,.2)}
    .diff-2{background:rgba(255,179,0,.1);color:#ffb300;border:1px solid rgba(255,179,0,.2)}
    .diff-3{background:rgba(255,82,82,.1);color:#ff5252;border:1px solid rgba(255,82,82,.2)}

    /* Profile card */
    .profile-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 15px;margin-bottom:16px}
    .profile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
    .profile-elo{font-family:'Orbitron',sans-serif;font-size:1.35rem;font-weight:900;color:#fff}
    .profile-elo span{font-size:.68rem;color:rgba(255,255,255,.28);margin-left:3px;font-family:'Inter',sans-serif}
    .rank-progress-wrap{margin-top:10px}
    .rank-progress-label{display:flex;justify-content:space-between;font-size:.63rem;color:rgba(255,255,255,.28);margin-bottom:4px}
    .rank-progress-bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
    .rank-progress-fill{height:100%;border-radius:2px;transition:width .6s ease}
    .cat-bars{display:flex;flex-direction:column;gap:6px;margin-top:2px}
    .cat-row{display:flex;align-items:center;gap:7px}
    .cat-name{font-size:.68rem;color:rgba(255,255,255,.42);width:92px;flex-shrink:0}
    .cat-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
    .cat-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
    .cat-pct{font-size:.68rem;font-weight:600;width:30px;text-align:right;flex-shrink:0}

    /* Mode cards */
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .mode-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.09);border-radius:14px;padding:15px 10px;cursor:pointer;text-align:center;transition:all .18s;-webkit-tap-highlight-color:transparent}
    .mode-card.sel-create{border-color:#00ffc8;background:rgba(0,255,200,.07)}
    .mode-card.sel-join{border-color:#7c4dff;background:rgba(124,77,255,.08)}
    .mode-icon{font-size:1.8rem;margin-bottom:5px}
    .mode-name{font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:1px;margin-bottom:2px}
    .mode-hint{font-size:.65rem;color:rgba(255,255,255,.28)}
    .submode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
    .format-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
    .format-card{border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;border:1.5px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);transition:all .16s;-webkit-tap-highlight-color:transparent}
    .format-card.sel{border-color:var(--fc)}
    .format-icon{font-size:1.4rem;margin-bottom:3px}
    .format-name{font-family:'Orbitron',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
    .format-hint{font-size:.6rem;color:rgba(255,255,255,.28)}
    .submode-card{border-radius:12px;padding:12px 10px;cursor:pointer;text-align:center;border:1.5px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);transition:all .16s;-webkit-tap-highlight-color:transparent}
    .submode-card.sel-comp{border-color:#00ffc8;background:rgba(0,255,200,.06)}
    .submode-card.sel-coop{border-color:#7c4dff;background:rgba(124,77,255,.07)}
    .submode-icon{font-size:1.5rem;margin-bottom:4px}
    .submode-name{font-family:'Orbitron',sans-serif;font-size:.67rem;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
    .submode-hint{font-size:.63rem;color:rgba(255,255,255,.28)}

    /* Lobby */
    .room-code-wrap{text-align:center;margin:16px 0}
    .room-code{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:clamp(6px,2vw,12px);background:linear-gradient(135deg,#00ffc8,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .room-label{font-size:.65rem;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.26);margin-bottom:6px}
    .pulse{display:flex;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.32);font-size:.82rem;margin:12px 0}
    .dot{width:7px;height:7px;border-radius:50%;background:#00ffc8;animation:pls 1.2s ease-in-out infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes pls{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

    /* Live bar */
    .live-bar{display:flex;align-items:center;gap:8px;margin-bottom:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:9px 13px}
    .live-player{flex:1;text-align:center}
    .live-name{font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .live-score{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:900}
    .live-sep{color:rgba(255,255,255,.14);font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700}
    .ls-my{color:#00ffc8}.ls-opp{color:#b388ff}

    /* Coop bar */
    .coop-bar-wrap{margin-bottom:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:11px 14px}
    .coop-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .coop-combined{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:#7c4dff}
    .coop-track{height:8px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;position:relative}
    .coop-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#7c4dff,#00ffc8);transition:width .4s ease}
    .coop-marker{position:absolute;top:0;height:100%;width:2px;background:#ffb300;opacity:.7}
    .coop-players{display:flex;justify-content:space-between;margin-top:6px;font-size:.68rem;color:rgba(255,255,255,.35)}

    /* Quiz */
    .quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .q-cnt{font-family:'Orbitron',sans-serif;font-size:.67rem;color:rgba(255,255,255,.26);white-space:nowrap}
    .prog-bar{flex:1;min-width:0;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
    .prog-fill{height:100%;background:linear-gradient(90deg,#00ffc8,#7c4dff);border-radius:2px;transition:width .4s ease}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:11px}
    .bp{background:rgba(0,255,200,.1);color:#00ffc8;border:1px solid rgba(0,255,200,.2)}
    .bg2{background:rgba(255,179,0,.1);color:#ffb300;border:1px solid rgba(255,179,0,.2)}
    .bv{background:rgba(124,77,255,.12);color:#b388ff;border:1px solid rgba(124,77,255,.25)}
    .q-text{font-size:1rem;line-height:1.65;color:#e8eaf6;margin-bottom:16px;font-weight:500}
    .options{display:flex;flex-direction:column;gap:7px}
    .opt{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:11px;padding:12px 13px;color:#e8eaf6;font-family:'Inter',sans-serif;font-size:.88rem;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;transition:all .14s;-webkit-tap-highlight-color:transparent;width:100%}
    .opt.correct{border-color:#00ffc8;background:rgba(0,255,200,.09);color:#00ffc8}
    .opt.wrong{border-color:#ff5252;background:rgba(255,82,82,.07);color:#ff8a80}
    .opt-l{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:.6rem;font-weight:700;flex-shrink:0}
    .opt.correct .opt-l{background:#00ffc8;color:#080c14}
    .opt.wrong .opt-l{background:#ff5252;color:#fff}
    .expl{margin-top:11px;padding:11px 13px;background:rgba(255,255,255,.03);border-left:3px solid #00ffc8;border-radius:0 9px 9px 0;font-size:.81rem;color:rgba(255,255,255,.56);line-height:1.5;animation:fadeUp .22s ease}
    .expl.bad{border-left-color:#ff5252}
    .next-btn{margin-top:12px;width:100%;padding:12px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:11px;color:#fff;font-family:'Inter',sans-serif;font-size:.82rem;letter-spacing:.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}

    /* Waiting */
    .wait-overlay{text-align:center;padding:12px 0}
    .wait-icon{font-size:2.2rem;margin-bottom:8px}
    .wait-title{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:#ffb300;margin-bottom:5px}
    .my-fin{font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;color:#00ffc8;margin:8px 0 2px}

    /* Results */
    .vs-row{display:flex;gap:10px;margin-bottom:16px}
    .vs-card{flex:1;background:rgba(255,255,255,.04);border-radius:14px;padding:14px 10px;text-align:center;border:1.5px solid rgba(255,255,255,.07)}
    .vs-card.winner{border-color:#00ffc8;background:rgba(0,255,200,.05)}
    .vs-card.loser{border-color:rgba(255,82,82,.22)}
    .vs-card.draw{border-color:#ffb300}
    .vs-pname{font-size:.61rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.26);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .vs-score{font-family:'Orbitron',sans-serif;font-size:1.7rem;font-weight:900}
    .vs-lbl{font-size:.65rem;margin-top:5px;font-weight:600}
    .vs-sep{display:flex;align-items:center;font-family:'Orbitron',sans-serif;font-size:.75rem;color:rgba(255,255,255,.16);font-weight:700}

    /* Analysis */
    .elo-change-wrap{text-align:center;margin:4px 0 18px}
    .elo-delta{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900}
    .elo-delta.pos{color:#00ffc8}.elo-delta.neg{color:#ff5252}.elo-delta.zero{color:#ffb300}
    .elo-path{font-size:.76rem;color:rgba(255,255,255,.32);margin-top:3px}
    .shield-earned-box{background:rgba(0,255,200,.08);border:1px solid rgba(0,255,200,.25);border-radius:11px;padding:11px 14px;text-align:center;margin-bottom:14px}
    .analysis-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:13px;margin-bottom:12px}
    .cat-compare-row{display:grid;grid-template-columns:88px 1fr 44px 1fr 44px;align-items:center;gap:5px;margin-bottom:9px}
    .cat-compare-row:last-child{margin-bottom:0}
    .cat-lbl-sm{font-size:.66rem;color:rgba(255,255,255,.38)}
    .mini-bar-wrap{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
    .mini-bar-fill{height:100%;border-radius:3px}
    .mini-pct{font-size:.68rem;font-weight:600;text-align:right}
    .weak-box{background:rgba(255,82,82,.06);border:1px solid rgba(255,82,82,.17);border-radius:11px;padding:12px 14px;margin-bottom:12px}
    .weak-title{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:#ff8a80;margin-bottom:5px;font-weight:600}
    .weak-body{font-size:.84rem;color:rgba(255,255,255,.62);line-height:1.4}
    .q-review{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px;margin-bottom:7px}
    .q-review-text{font-size:.81rem;color:rgba(255,255,255,.58);margin-bottom:5px;line-height:1.4}
    .q-review-ans{font-size:.79rem;color:#00ffc8;font-weight:600}
    .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.81rem}
    .stat-lbl{color:rgba(255,255,255,.33)}.stat-val{font-weight:600}
    .coop-result-big{text-align:center;margin:6px 0 18px}
    .coop-result-score{font-family:'Orbitron',sans-serif;font-size:2.8rem;font-weight:900}

    /* XP bar */
    .xp-bar-wrap{margin-top:8px}

const XP_CORRECT=10, XP_WIN=50, XP_DRAW=20, XP_STREAK_BONUS=15, XP_PERFECT=100, XP_HINT_USED=-5;
const XP_LEVELS=[0,100,250,500,800,1200,1700,2300,3000,4000,5500,7500,10000];
function xpLevel(xp){let l=0;for(let i=0;i<XP_LEVELS.length;i++){if(xp>=XP_LEVELS[i])l=i;}return l;}
function xpToNext(xp){const l=xpLevel(xp);const next=XP_LEVELS[l+1];if(!next)return 0;return next-xp;}
function xpProgress(xp){const l=xpLevel(xp);const next=XP_LEVELS[l+1];if(!next)return 100;const prev=XP_LEVELS[l];return Math.round((xp-prev)/(next-prev)*100);}

// ═══════════════════════════════════════════════════
// RANK / ELO
// ═══════════════════════════════════════════════════
function getRank(elo){for(let i=RANKS.length-1;i>=0;i--)if(elo>=RANKS[i].min)return{...RANKS[i],idx:i};return{...RANKS[0],idx:0};}
function rankProg(elo){const r=getRank(elo);const nx=RANKS[r.idx+1];if(!nx)return 100;return Math.min(100,Math.round(((elo-r.min)/(nx.min-r.min))*100));}
function nextRankN(elo){const r=getRank(elo);return RANKS[r.idx+1]?.n||'MAX 🏆';}
function calcEloDelta(me,opp,res){return Math.round(K*(res-1/(1+Math.pow(10,(opp-me)/400))));}
function rankBadge(elo){const r=getRank(elo);return`<span class="rank-badge" style="border-color:${r.color}33;color:${r.color};background:${r.color}12">${r.emoji} ${r.n}</span>`;}

// ═══════════════════════════════════════════════════
// STREAK / SHIELD
// ═══════════════════════════════════════════════════
function todayStr(){return new Date().toISOString().slice(0,10);}
function updateStreak(prof){
  const today=todayStr(),last=prof.lastPlayedDate||'';
  if(last===today)return null;
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let streak=last===yesterday?(prof.streak||0)+1:1;
  let shieldActive=prof.shieldActive||false,shieldJustEarned=false;
  if(streak%SHIELD_EVERY===0&&!shieldActive){shieldActive=true;shieldJustEarned=true;}
  return{streak,lastPlayedDate:today,shieldActive,shieldJustEarned};
}
function shieldHTML(prof){
  if(prof?.shieldActive)return`<div class="shield-active">🛡️ Shield aktívny</div>`;
  const prog=(prof?.streak||0)%SHIELD_EVERY;
  const pips=Array.from({length:SHIELD_EVERY},(_,i)=>`<div class="shield-pip ${i<prog?'filled':''}"></div>`).join('');
  return`<div class="shield-progress">🛡️ ${pips} ${prog}/${SHIELD_EVERY}</div>`;
}

// ═══════════════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════════════
function calcDiff(prof){
  if((prof?.gamesPlayed||0)<3)return 2;
  const st=prof?.stats;if(!st)return 2;
  let tot=0,ok=0;Object.values(st).forEach(s=>{tot+=s.played;ok+=s.correct;});
  if(tot<10)return 2;const acc=ok/tot;
  return acc>0.78?3:acc<0.52?1:2;
}
function diffHint(d){
  if(d===1)return'Focus on B2 level questions. Student is struggling, keep contexts clear, avoid very advanced C1.';
  if(d===3)return'Focus on C1 level questions. Advanced idioms, complex grammar, nuanced vocabulary. Push the student.';
  return'Mix B2 and C1 questions evenly at the B2/C1 transition level.';
}

// ═══════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════
function catKey(t){if(!t)return'vocab';if(t.includes('Phrasal'))return'phrasal';if(t.includes('Grammar'))return'grammar';return'vocab';}
function mergeStats(ex,answers,questions){
  const st={phrasal:{played:0,correct:0,...(ex?.phrasal||{})},grammar:{played:0,correct:0,...(ex?.grammar||{})},vocab:{played:0,correct:0,...(ex?.vocab||{})}};
  answers.forEach((a,i)=>{const k=catKey(questions[i]?.type);st[k].played++;if(a.correct)st[k].correct++;});
  return st;
}
function catPct(stats,k){const s=stats?.[k];if(!s||!s.played)return null;return Math.round(s.correct/s.played*100);}
function weakestCat(stats){let min=101,key='vocab';Object.keys(CATS).forEach(k=>{const p=catPct(stats,k);if(p!==null&&p<min){min=p;key=k;}});return key;}

// ═══════════════════════════════════════════════════
// CEFR AI ASSESSMENT
// ═══════════════════════════════════════════════════
async function runCefrAssessment(){
  const prof=S.myProfile;
  if(!prof)return;
  const games=prof.gamesPlayed||0;
  if(games<10||games%10!==0)return; // only every 10 games

  const stats=prof.stats||{};
  const ph=stats.phrasal||{played:0,correct:0};
  const gr=stats.grammar||{played:0,correct:0};
  const vo=stats.vocab||{played:0,correct:0};
  const phPct=ph.played?Math.round(ph.correct/ph.played*100):null;
  const grPct=gr.played?Math.round(gr.correct/gr.played*100):null;
  const voPct=vo.played?Math.round(vo.correct/vo.played*100):null;
  const diff=calcDiff(prof);
  const diffLabel=diff===1?'B2':diff===3?'C1':'B2/C1';

  // Game history summary (last 10 games approximated from stats)
  const totalPlayed=ph.played+gr.played+vo.played;
  const totalCorrect=ph.correct+gr.correct+vo.correct;
  const overallPct=totalPlayed?Math.round(totalCorrect/totalPlayed*100):50;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','x-api-key':S.ak,'anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,messages:[{role:'user',content:
        `You are an expert English language assessor. Based on these quiz performance statistics, assess the student's RECEPTIVE English level (reading comprehension, grammar, vocabulary knowledge) according to CEFR.

Statistics from last ${games} games:
- Phrasal Verbs accuracy: ${phPct!==null?phPct+'%':'no data'}  (${ph.correct}/${ph.played} questions)
- Advanced Grammar accuracy: ${grPct!==null?grPct+'%':'no data'} (${gr.correct}/${gr.played} questions)  
- Vocabulary & Idioms accuracy: ${voPct!==null?voPct+'%':'no data'} (${vo.correct}/${vo.played} questions)
- Overall accuracy: ${overallPct}%
- Current question difficulty: ${diffLabel}
- ELO rating: ${prof.elo||1000}
- Win rate: ${games>0?Math.round((prof.wins||0)/games*100)+'%':'n/a'}

Respond ONLY in Slovak language with this exact JSON (no markdown):
{"level":"B2+","summary":"2-3 sentences about their level","strengths":"1-2 specific strong areas","weaknesses":"1-2 specific weak areas","advice":"1 concrete study recommendation"}

Level must be one of: A2, B1, B1+, B2, B2+, C1, C1+`
      }]})
    });
    if(!res.ok)return;
    const data=await res.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    const m=text.match(/\{[\s\S]*\}/);
    if(!m)return;
    const result=JSON.parse(m[0]);
    result.assessedAt=Date.now();result.gamesAt=games;
    S.cefrResult=result;
    await dbUp('users/'+S.uid,{cefrResult:result});
    S.myProfile={...S.myProfile,cefrResult:result};
  }catch(e){console.warn('CEFR assessment failed',e);}
}

// ═══════════════════════════════════════════════════
// PLACEMENT TEST
// ═══════════════════════════════════════════════════
async function genPlacementQs(){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','x-api-key':S.ak,'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,messages:[{role:'user',content:
      `Generate exactly 6 multiple-choice English questions for a placement test to determine if a student is B2 or C1 level. Include 2 easy B2 questions, 2 medium B2-C1 questions, and 2 hard C1 questions. Mix grammar, vocabulary and phrasal verbs.
Return ONLY raw JSON: {"questions":[{"id":1,"type":"Phrasal Verbs","question":"...","options":["A","B","C","D"],"correct":0,"explanation":"...","example":"...","level":"B2"}]}
Rules: level must be "B2", "B2-C1", or "C1". type must be "Phrasal Verbs","Advanced Grammar", or "Vocabulary & Idioms". explanation in Slovak. example is a short natural English sentence.`
    }]})
  });
  if(!res.ok)throw new Error('API '+res.status);
  const data=await res.json();
  const text=data.content?.find(b=>b.type==='text')?.text||'';
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error('Neplatná odpoveď');
  const p=JSON.parse(m[0]);if(!p.questions?.length)throw new Error('Prázdne');
  return p.questions;
}

function calcPlacementElo(answers,questions){
  let score=0;
  answers.forEach((a,i)=>{
    if(!a.correct)return;
    const lvl=questions[i]?.level||'B2-C1';
    score+=lvl==='C1'?3:lvl==='B2-C1'?2:1;
  });
  const max=questions.reduce((s,q)=>s+(q.level==='C1'?3:q.level==='B2-C1'?2:1),0);
  const pct=score/max;
  if(pct>=0.85)return{elo:1200,label:'C1 Scholar 📚',msg:'Výborné! Štartuješ na C1 úrovni.'};
  if(pct>=0.65)return{elo:1080,label:'C1 Initiate ✨',msg:'Dobrá B2→C1 báza. Blízko k C1!'};
  if(pct>=0.4) return{elo:950, label:'B2 Veteran 🛡️',msg:'Solídne B2. Máš čo zlepšovať!'};
  return{elo:820,label:'B2 Soldier ⚔️',msg:'Začínaš na B2. Postupne to dáme!'};
}

async function finishPlacement(){
  const result=calcPlacementElo(S.placementAnswers,S.placementQs);
  await dbUp('users/'+S.uid,{elo:result.elo,placementDone:true});
  S.myProfile={...S.myProfile,elo:result.elo,placementDone:true};
  S.screen='placement_result';
  S.placementResult=result;
  render();
}

const SR_INTERVALS=[1,3,7,14]; // days between reviews

async function saveSRQuestions(wrongQuestions){
  if(!wrongQuestions.length)return;
  try{
    const existing=(await dbGet('sr/'+S.uid))||{};
    const now=Date.now();
    wrongQuestions.forEach(q=>{
      const key='q'+q.id+'_'+catKey(q.type);
      const prev=existing[key];
      const interval=prev?SR_INTERVALS[Math.min(prev.stage,SR_INTERVALS.length-1)]:SR_INTERVALS[0];
      // Extract keyword from correct answer (first 3 words or whole answer if short)
      const correctAns=q.options[q.correct]||'';
      const keyword=q.srKeyword||correctAns.split(' ').slice(0,3).join(' ');
      existing[key]={
        question:q.question,options:q.options,correct:q.correct,
        explanation:q.explanation,type:q.type,
        srKeyword:keyword,
        dueDate:now+interval*86400000,
        stage:prev?(prev.stage||0)+1:0,
        addedAt:now
      };
    });
    await dbSet('sr/'+S.uid,existing);
  }catch(e){console.warn('SR save failed',e);}
}

async function loadDueSRQuestions(){
  try{
    const all=await dbGet('sr/'+S.uid);
    if(!all)return[];
    const now=Date.now();
    return Object.values(all)
      .filter(q=>q.dueDate<=now)
      .slice(0,3)
      .map((q,i)=>({...q,id:900+i,isSR:true}));
  }catch(e){return[];}
}

async function loadAllSRQuestions(){
  try{
    const all=await dbGet('sr/'+S.uid);
    if(!all)return[];
    // Sort by dueDate ascending (most overdue first)
    return Object.values(all)
      .sort((a,b)=>a.dueDate-b.dueDate)
      .slice(0,10)
      .map((q,i)=>({...q,id:900+i,isSR:true}));
  }catch(e){return[];}
}

async function genSROnlyQuestions(srQs){
  const tot=10;
  // If enough SR questions, use them all
  if(srQs.length>=tot){
    return srQs.slice(0,tot).map((q,i)=>({...q,id:900+i,isSR:true}));
  }
  // Load more from all SR (not just due today)
  const allSR=await loadAllSRQuestions();
  if(allSR.length>=tot){
    return allSR.slice(0,tot).map((q,i)=>({...q,id:900+i,isSR:true}));
  }
  // Not enough SR questions — fill rest with normal questions
  const needed=tot-allSR.length;
  const diff=calcDiff(S.myProfile);
  const filler=await genQ(diff,S.myProfile?.stats,[],S.format==='sr'?'mixed':S.format);
  const fillerSlice=filler.slice(0,needed);
  return [...allSR,...fillerSlice].slice(0,tot);
}

// ANALYSIS
// ═══════════════════════════════════════════════════
async function runAnalysis(){
  if(S.analysisStarted)return;
  S.analysisStarted=true;
  S.screen='analysis';S.analysisReady=false;render();
  try{
    const myElo=S.myProfile?.elo||START_ELO;
    let oppElo=START_ELO;
    if(S.oppUid){const op=await dbGet('users/'+S.oppUid);if(op?.elo)oppElo=op.elo;}
    const isCoop=S.submode==='coop';
    const tot=S.questions.length;
    let delta=0;
    if(isCoop){
      const combined=S.score+S.oppScore,target=Math.ceil(tot*2*COOP_TARGET_PCT);
      delta=combined>=target?15:-8;
    }else{
      const res=S.score>S.oppScore?1:S.score===S.oppScore?.5:0;
      delta=calcEloDelta(myElo,oppElo,res);
      if(delta<0&&S.myProfile?.shieldActive){delta=0;await dbUp('users/'+S.uid,{shieldActive:false});}
    }
    // Deduct hint penalty
    const hintPenalty=S.hintUsed?5:0;
    delta=delta-hintPenalty;
    S.eloChange=delta;S.newElo=Math.max(100,myElo+delta);
    const streakUpd=updateStreak(S.myProfile||{});
    S.shieldJustEarned=streakUpd?.shieldJustEarned||false;
    const newStats=mergeStats(S.myProfile?.stats,S.myAnswers,S.questions);
    const isWin=(!isCoop&&S.score>S.oppScore)||(isCoop&&(S.score+S.oppScore)>=Math.ceil(tot*2*COOP_TARGET_PCT));
    const isDraw=!isCoop&&S.score===S.oppScore;
    // XP calculation
    const correctCount=S.myAnswers.filter(a=>a.correct).length;
    const isPerfect=correctCount===tot;
    const streak=(streakUpd?.streak!=null?streakUpd.streak:S.myProfile?.streak)||0;
    let xpGained=correctCount*XP_CORRECT;
    if(isWin)xpGained+=XP_WIN;
    else if(isDraw)xpGained+=XP_DRAW;
    if(isPerfect)xpGained+=XP_PERFECT;
    if(streak>0&&streak%3===0)xpGained+=XP_STREAK_BONUS;
    if(S.hintUsed)xpGained+=XP_HINT_USED;
    xpGained=Math.max(0,xpGained);
    const oldXp=S.myProfile?.xp||0;
    const newXp=oldXp+xpGained;
    const oldLevel=xpLevel(oldXp);
    const newLevel=xpLevel(newXp);
    S.xpGained=xpGained;S.newXp=newXp;
    S.leveledUp=newLevel>oldLevel?newLevel:0;
    const upd={name:S.name,elo:S.newElo,gamesPlayed:(S.myProfile?.gamesPlayed||0)+1,wins:(S.myProfile?.wins||0)+(isWin?1:0),stats:newStats,xp:newXp,...(streakUpd||{})};
    delete upd.shieldJustEarned;
    await dbUp('users/'+S.uid,upd);
    S.myProfile={...S.myProfile,...upd,stats:newStats};
    S.analysisReady=true;render();
    // Run CEFR assessment every 10 games (async, non-blocking)
    runCefrAssessment();
    // Cleanup room from Firebase
    if(S.roomCode)S.db?.ref('rooms/'+S.roomCode).remove().catch(()=>{});
  }catch(e){console.error(e);S.analysisReady=true;render();}
}

function updateLiveBar(){
  const isCoop=S.submode==='coop';
  const cur=S.score+(S.selected!==null&&S.selected===S.questions[S.current]?.correct?1:0);
  if(isCoop){
    const combined=cur+S.oppScore,tot=S.questions.length*2,target=Math.ceil(tot*COOP_TARGET_PCT);
    const w=Math.min(100,Math.round(combined/tot*100));
    const cf=g('coop-fill'),cc=g('coop-combined'),p1s=g('p1-sub'),p2s=g('p2-sub');
    if(cf)cf.style.width=w+'%';
    if(cc)cc.textContent=combined+'/'+tot;
    if(p1s)p1s.textContent=S.name+': '+cur;
    if(p2s)p2s.textContent=(S.oppName||'Partner')+': '+S.oppScore;
  }else{
    const ml=g('my-ls'),ol=g('opp-ls'),on2=g('opp-nm');
    if(ml)ml.textContent=cur;if(ol)ol.textContent=S.oppScore;
    if(on2)on2.textContent=S.oppName||'Súper';
  }
}

function hQuiz(){
  const q=S.questions[S.current],tot=S.questions.length,ans=S.selected!==null;
  const pw=Math.round(S.current/tot*100),isCoop=S.submode==='coop';
  const ls=S.score+(ans&&S.selected===q.correct?1:0);
  const combinedTot=tot*2,combined=ls+S.oppScore,target=Math.ceil(combinedTot*COOP_TARGET_PCT);
  const cw=Math.min(100,Math.round(combined/combinedTot*100)),mrkL=Math.min(100,Math.round(target/combinedTot*100));
  function bc(t){return t?.includes('Phrasal')?'bp':t?.includes('Grammar')?'bg2':'bv';}
  const opts=q.options.map((o,i)=>{
    let c='opt';
    if(ans){
      if(i===q.correct)c+=' correct';
      else if(i===S.selected&&S.selected!==-1)c+=' wrong';
    }
    return`<button class="${c}" data-i="${i}" ${ans?'disabled':''}><span class="opt-l">${LT[i]}</span>${o}</button>`;
  }).join('');
  const liveSection=isCoop?`
    <div class="coop-bar-wrap">
      <div class="coop-bar-top"><span style="font-size:.66rem;color:rgba(255,255,255,.28);letter-spacing:1px;text-transform:uppercase">Spoločné skóre</span><span class="coop-combined" id="coop-combined">${combined}/${combinedTot}</span></div>
      <div class="coop-track"><div class="coop-fill" id="coop-fill" style="width:${cw}%"></div><div class="coop-marker" style="left:${mrkL}%"></div></div>
      <div class="coop-players"><span id="p1-sub">${S.name}: ${ls}</span><span style="color:#ffb300;font-size:.64rem">Cieľ: ${target}</span><span id="p2-sub">${S.oppName||'Partner'}: ${S.oppScore}</span></div>
    </div>`:`
    <div id="livebar" class="live-bar">
      <div class="live-player"><div class="live-name">${S.name}</div><div class="live-score ls-my" id="my-ls">${ls}</div></div>
      <div class="live-sep">VS</div>
      <div class="live-player"><div class="live-name" id="opp-nm">${S.oppName||'Súper'}</div><div class="live-score ls-opp" id="opp-ls">${S.oppScore}</div></div>
    </div>`;
  return`${liveSection}
  <div class="quiz-head">${!ans?timerHTML():''}<div class="prog-bar"><div class="prog-fill" style="width:${pw}%"></div></div><span class="q-cnt">${S.current+1}/${tot}</span></div>

  ${q.isSR?'<span class="sr-badge" style="margin-right:6px">🔁</span>':''}<span class="badge ${bc(q.type)}">${q.type}</span>
  <div class="q-text">${q.question}</div>
  <div class="options">${opts}</div>
  ${!ans&&!S.hintUsed?`<button class="hint-btn" id="hintBtn">💡 Nápoveda <span class="hint-cost">(-5 ELO)</span></button>`:''}
  ${ans?`<div class="expl ${S.selected===-1||S.selected!==q.correct?'bad':''}">
    ${S.selected===-1?'Čas vypršal! ':''}${q.explanation}
  </div>
  ${q.example?`<div class="example-box"><div class="ex-label">Príklad použitia</div><div class="ex-text">"${q.example}"</div></div>`:''}
  <button class="next-btn" id="nextBtn">${S.current+1>=tot?'DOKONČIŤ →':'ĎALŠIA →'}</button>`:''}`;}

function hAnalysis(){
  if(!S.analysisReady)return`<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">${(S.myProfile?.gamesPlayed||0)%10===0&&(S.myProfile?.gamesPlayed||0)>0?'Hodnotím tvoju úroveň angličtiny...':'Počítam ELO a štatistiky...'}</div></div>`;
  const isCoop=S.submode==='coop',tot=S.questions.length;
  const delta=S.eloChange,newElo=S.newElo||S.myProfile?.elo||START_ELO,oldElo=newElo-delta;
  const rank=getRank(newElo),prog=rankProg(newElo),nxt=nextRankN(newElo),stats=S.myProfile?.stats;
  const xpG=S.xpGained||0,nXp=S.newXp||0;
  const xpLvl=xpLevel(nXp),xpProg=xpProgress(nXp),xpNxt=xpToNext(nXp);
  const eloBlock=`<div class="elo-change-wrap">
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:4px">
      <div>
        <div class="elo-delta ${delta>0?'pos':delta<0?'neg':'zero'}">${delta>0?'+'+delta:delta===0?'±0':delta} ELO</div>
        <div style="font-size:.65rem;color:rgba(255,255,255,.3);text-align:center">ELO</div>
      </div>
      <div style="width:1px;height:40px;background:rgba(255,255,255,.08)"></div>
      <div>
        <div style="font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;color:#b388ff;text-align:center">+${xpG}</div>
        <div style="font-size:.65rem;color:rgba(255,255,255,.3);text-align:center">XP</div>
      </div>
    </div>
    <div class="elo-path">${oldElo} → ${newElo} · ${rankBadge(newElo)}</div>
    ${delta===0&&!isCoop?'<div style="font-size:.72rem;color:rgba(0,255,200,.7);margin-top:5px">🛡️ Shield absorboval ELO stratu!</div>':''}
    <div style="margin-top:10px">
      <div class="rank-progress-label" style="font-size:.62rem;color:rgba(255,255,255,.25);display:flex;justify-content:space-between;margin-bottom:4px"><span>${rank.n}</span><span>${nxt}</span></div>
      <div class="rank-progress-bar"><div class="rank-progress-fill" style="width:${prog}%;background:${rank.color}"></div></div>
    </div>
    <div class="xp-bar-wrap" style="margin-top:8px">
      <div class="xp-bar-label"><span><span class="xp-badge">⭐ Level ${xpLvl}</span></span><span>${nXp} XP · +${xpNxt} do ďalšieho</span></div>
      <div class="xp-bar"><div class="xp-bar-fill" style="width:${xpProg}%"></div></div>
    </div>
    ${S.leveledUp?`<div style="text-align:center;margin-top:10px;padding:10px;background:rgba(124,77,255,.15);border:1px solid rgba(124,77,255,.35);border-radius:12px"><div style="font-family:'Orbitron',sans-serif;font-size:.85rem;color:#b388ff;font-weight:700">🎉 LEVEL UP! → Level ${S.leveledUp}</div></div>`:''}
  </div>`;
  const shieldBlock=S.shieldJustEarned?`<div class="shield-earned-box"><div style="font-family:'Orbitron',sans-serif;font-size:.8rem;color:#00ffc8;margin-bottom:3px">🛡️ Shield získaný!</div><div style="font-size:.78rem;color:rgba(255,255,255,.44)">Hrals/a ${S.myProfile?.streak} dní za sebou. Ďalšia ELO strata bude chránená.</div></div>`:'';
  const catRows=Object.entries(CATS).map(([k,c])=>{
    const myQs=S.questions.filter(q=>catKey(q.type)===k);if(!myQs.length)return'';
    const myOk=myQs.filter(q=>{const i=S.questions.indexOf(q);return S.myAnswers[i]?.correct;}).length;
    const oppOk=myQs.filter(q=>{const i=S.questions.indexOf(q);return S.oppAnswers[i]?.c===1;}).length;
    const n=myQs.length,myP=Math.round(myOk/n*100),oppP=Math.round(oppOk/n*100);
    return`<div class="cat-compare-row"><span class="cat-lbl-sm">${c.label.split('&')[0].trim()}</span>
    <div class="mini-bar-wrap"><div class="mini-bar-fill" style="width:${myP}%;background:${c.color}80"></div></div>
    <span class="mini-pct" style="color:${c.color}">${myOk}/${n}</span>
    <div class="mini-bar-wrap"><div class="mini-bar-fill" style="width:${oppP}%;background:#ffffff25"></div></div>
    <span class="mini-pct" style="color:rgba(255,255,255,.42)">${oppOk}/${n}</span></div>`;
  }).join('');
  const wk=stats?weakestCat(stats):null,wkP=wk?catPct(stats,wk):null,diff=calcDiff(S.myProfile);
  const diffMsg=diff===1?'Obtiažnosť zostáva nízka — viac B2 tréning.':diff===3?'Obtiažnosť rastie — C1 výzvy ťa čakajú!':'Obtiažnosť kalibrovaná na B2→C1.';
  const weakBlock=wk&&wkP!==null?`<div class="weak-box"><div class="weak-title">⚠️ Najslabšia oblasť</div>
    <div class="weak-body"><strong style="color:${CATS[wk].color}">${CATS[wk].label}</strong> — ${wkP}% (${stats[wk].correct}/${stats[wk].played} historicky)</div>
    <div style="font-size:.72rem;color:rgba(255,255,255,.32);margin-top:5px">AI zahrnie viac tejto oblasti v ďalšom dueli. ${diffMsg}</div></div>`:'';
  const bothWrong=S.questions.filter((_,i)=>S.myAnswers[i]&&!S.myAnswers[i].correct&&S.oppAnswers[i]&&S.oppAnswers[i].c!==1).slice(0,2);
  const wrongBlock=bothWrong.length?`<div class="sec-title">Obaja ste pokazili</div>${bothWrong.map(q=>`<div class="q-review"><div class="q-review-text">${q.question}</div><div class="q-review-ans">✅ ${q.options[q.correct]}</div></div>`).join('')}`:'';
  return`<div class="logo" style="font-size:1.2rem;margin-bottom:4px">ROZBOR DUELU</div>
  <div class="logo-sub" style="margin-bottom:16px">${isCoop?'Kooperatívna analýza':'Analýza výkonu'}</div>
  ${eloBlock}${shieldBlock}
  <div class="sec-title">Výkon po kategóriách</div>
  <div class="analysis-box">
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:7px;font-size:.62rem;color:rgba(255,255,255,.26)"><span style="width:44px;text-align:right">TY</span><span style="width:44px;text-align:right">${isCoop?'PARTNER':'SÚPER'}</span></div>
    ${catRows}
  </div>
  ${weakBlock}${wrongBlock}
  <button class="btn btn-rematch" id="rematchBtn" style="margin-top:4px">⚔️ REMATCH</button>
  <button class="btn btn-ghost" id="newBtn" style="margin-top:9px">NOVÝ DUEL</button>`;}

// ═══════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════
function bindAll(){
  // Auth screen
  g('googleSignIn')?.addEventListener('click',()=>signInGoogle());
  // Setup screen
  g('saveSetup')?.addEventListener('click',()=>{
    const ak=(g('ak')?.value||'').trim();
    if(!ak||!ak.startsWith('sk-')){S.error='API kľúč musí začínať "sk-"';render();return;}
    S.ak=ak;S.error=null;
    localStorage.setItem('ed_ak',ak);
    if(!initFB(FB_CONFIG)){render();return;}
    startAuthListener();
  });
  // Home
  g('signOutBtn')?.addEventListener('click',()=>signOut());
  g('nameInp')?.addEventListener('input',e=>{
    S.name=e.target.value;
    if(S.name.trim())localStorage.setItem('ed_nick',S.name.trim());
    const ok=S.name.trim()&&S.mode&&(S.mode==='create'||(S.mode==='join'&&S.roomCode.length===4));
    if(g('goBtn'))g('goBtn').disabled=!ok;
  });
  g('mCr')?.addEventListener('click',()=>{S.mode='create';render();});
  g('mJn')?.addEventListener('click',()=>{S.mode='join';render();});
  g('sCmp')?.addEventListener('click',()=>{S.submode='competitive';render();});
  g('sCoop')?.addEventListener('click',()=>{S.submode='coop';render();});
  Object.keys(FORMATS).forEach(k=>{
    g('fmt_'+k)?.addEventListener('click',()=>{
      if(k==='sr'&&(S.myProfile?.gamesPlayed||0)<5)return;
      S.format=k;render();
    });
  });
  g('codeInp')?.addEventListener('input',e=>{
    S.roomCode=e.target.value.replace(/\D/g,'');e.target.value=S.roomCode;
    if(g('goBtn'))g('goBtn').disabled=!S.name.trim()||S.roomCode.length!==4;
  });
  g('goBtn')?.addEventListener('click',handleGo);
  g('cfgBtn')?.addEventListener('click',()=>{S.screen='setup';S.error=null;render();});
  g('cancelBtn')?.addEventListener('click',()=>{
    detach();if(S.roomCode)S.db?.ref('rooms/'+S.roomCode).remove().catch(()=>{});resetGame();render();
  });
  // Placement test handlers
  document.querySelectorAll('[data-pi]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(S.placementAnswers.length>S.placementCurrent)return;
      const i=parseInt(btn.dataset.pi);
      const q=S.placementQs[S.placementCurrent];
      const correct=i===q.correct;
      S.placementAnswers.push({correct,chosen:i});
      render();
    });
  });
  g('placementNextBtn')?.addEventListener('click',()=>{
    if(S.placementCurrent+1>=S.placementQs.length){
      finishPlacement();
    }else{
      S.placementCurrent++;
      render();
    }
  });
  g('startPlayingBtn')?.addEventListener('click',()=>{
    S.screen='home';render();
  });
  g('hintBtn')?.addEventListener('click',()=>{
    if(S.hintUsed||S.selected!==null)return;
    S.hintUsed=true;
    // Eliminate 2 wrong options visually
    const q=S.questions[S.current];
    const wrongIdxs=q.options.map((_,i)=>i).filter(i=>i!==q.correct);
    // Pick 2 random wrong to eliminate
    for(let i=wrongIdxs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[wrongIdxs[i],wrongIdxs[j]]=[wrongIdxs[j],wrongIdxs[i]];}
    const toElim=wrongIdxs.slice(0,2);
    document.querySelectorAll('.opt').forEach((btn,idx)=>{
      if(toElim.includes(idx))btn.classList.add('eliminated');
    });
    g('hintBtn').disabled=true;
    g('hintBtn').textContent='💡 Nápoveda použitá';
  });
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(S.selected!==null)return;
      clearTimer();
      const i=parseInt(btn.dataset.i);S.selected=i;
      const q=S.questions[S.current];const correct=i===q.correct;
      if(correct)S.score++;
      S.myAnswers.push({correct,type:q.type});
      dbUp('rooms/'+S.roomCode+'/'+S.role,{score:S.score}).catch(()=>{});
      render();
      if(correct)setTimeout(()=>showXpPopup('+'+XP_CORRECT+' XP'),50);
    });
  });
  // Start timer when quiz question is shown and unanswered
  if(S.screen==='quiz'&&S.selected===null) startTimer();
  g('nextBtn')?.addEventListener('click',()=>{
    clearTimer();
    if(S.current+1>=S.questions.length)finishQuiz();
    else{S.current++;S.selected=null;S.hintUsed=false;render();}
  });
  g('analysisBtn')?.addEventListener('click',()=>runAnalysis());
  g('newBtn')?.addEventListener('click',()=>{detach();resetGame();render();});
  g('rematchBtn')?.addEventListener('click',async()=>{
    clearTimer();detach();
    // Create new room with same submode, opponent gets notified via Firebase
    const prevOppName=S.oppName,prevOppUid=S.oppUid,prevSubmode=S.submode;
    resetGame();
    S.submode=prevSubmode;S.mode='create';S.name=S.name||'';
    S.loadingMsg='Generujem rematch otázky...';S.screen='loading';render();
    try{
      const diff=calcDiff(S.myProfile);
      S.srQuestions=await loadDueSRQuestions();
      const qs=await genQ(diff,S.myProfile?.stats,S.srQuestions,S.format);
      const code=String(Math.floor(1000+Math.random()*9000));
      S.roomCode=code;S.role='p1';
      await dbSet('rooms/'+code,{status:'waiting',submode:prevSubmode,questions:qs,createdAt:Date.now(),p1uid:S.uid,p1:{name:S.name||'Hráč 1',score:0,finished:false},isRematch:true});
      S.questions=qs;attach(code);S.screen='lobby';render();
    }catch(e){S.error='Chyba: '+e.message;S.screen='home';render();}
  });
}

// ═══════════════════════════════════════════════════
// XP POPUP
// ═══════════════════════════════════════════════════
function showXpPopup(text){
  const el=document.createElement('div');
  el.className='xp-popup';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

// ═══════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════
function startTimer(){
  clearTimer();
  S.timerVal=25;
  S.timerInterval=setInterval(()=>{
    S.timerVal--;
    updateTimerUI();
    if(S.timerVal<=0){
      clearTimer();
      // Time's up — auto wrong answer
      if(S.selected===null){
        S.selected=-1; // -1 = timeout
        S.myAnswers.push({correct:false,type:S.questions[S.current]?.type,timeout:true});
        dbUp('rooms/'+S.roomCode+'/'+S.role,{score:S.score}).catch(()=>{});
        render();
      }
    }
  },1000);
}
function clearTimer(){
  if(S.timerInterval){clearInterval(S.timerInterval);S.timerInterval=null;}
}
function updateTimerUI(){
  const num=document.getElementById('timer-num');
  const circle=document.getElementById('timer-circle');
  if(!num||!circle)return;
  num.textContent=S.timerVal;
  const pct=S.timerVal/25;
  const r=15,circ=2*Math.PI*r;
  circle.style.strokeDashoffset=circ*(1-pct);
  const color=S.timerVal>10?'#00ffc8':S.timerVal>5?'#ffb300':'#ff5252';
  circle.style.stroke=color;
  num.style.color=color;
}
function timerHTML(){
  const pct=S.timerVal/25,r=15,circ=2*Math.PI*r;
  const color=S.timerVal>10?'#00ffc8':S.timerVal>5?'#ffb300':'#ff5252';
  return`<div class="timer-ring">
    <svg width="36" height="36" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="${r}" stroke="rgba(255,255,255,.1)" stroke-width="3" fill="none"/>
      <circle id="timer-circle" cx="18" cy="18" r="${r}"
        stroke="${color}" stroke-width="3" fill="none"
        stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}"/>
    </svg>
    <div class="timer-num" id="timer-num" style="color:${color}">${S.timerVal}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════
async function handleGo(){
  S.error=null;S.name=g('nameInp')?.value.trim()||S.name;
  if(S.mode==='create'){
    S.loadingMsg='Generujem otázky...';S.screen='loading';render();
    try{
      const diff=calcDiff(S.myProfile);
      S.srQuestions=await loadDueSRQuestions();
      // SR mode: each player gets own questions, store only metadata in room
      let qs;
      if(S.format==='sr'){
        qs=await genSROnlyQuestions(S.srQuestions);
      }else{
        qs=await genQ(diff,S.myProfile?.stats,S.srQuestions,S.format);
      }
      const code=String(Math.floor(1000+Math.random()*9000));
      S.roomCode=code;S.role='p1';
      // In SR mode don't store questions in Firebase (each player has own)
      const roomData={status:'waiting',submode:S.submode,format:S.format,createdAt:Date.now(),p1uid:S.uid,p1:{name:S.name,score:0,finished:false}};
      if(S.format!=='sr')roomData.questions=qs;
      await dbSet('rooms/'+code,roomData);
      S.questions=qs;attach(code);S.screen='lobby';render();
    }catch(e){S.error='Chyba: '+e.message;S.screen='home';render();}
  }else{
    const code=g('codeInp')?.value.trim()||S.roomCode;
    S.roomCode=code;S.role='p2';S.loadingMsg='Pripájam sa...';S.screen='loading';render();
    try{
      const room=await dbGet('rooms/'+code);
      if(!room)throw new Error('Duel '+code+' neexistuje');
      if(room.status!=='waiting')throw new Error('Duel už beží alebo skončil');
      S.submode=room.submode||'competitive';S.format=room.format||'mixed';
      S.oppName=room.p1?.name||'';S.oppUid=room.p1uid||'';
      // SR mode: generate own questions, don't use room questions
      if(S.format==='sr'){
        S.loadingMsg='Načítavam tvoje SR otázky...';render();
        S.srQuestions=await loadDueSRQuestions();
        S.questions=await genSROnlyQuestions(S.srQuestions);
      }else{
        S.questions=room.questions;
      }
      attach(code);
      await dbUp('rooms/'+code,{status:'playing',p2uid:S.uid,'p2':{name:S.name,score:0,finished:false}});
      S.screen='quiz';render();
    }catch(e){detach();S.error='Chyba: '+e.message;S.screen='home';render();}
  }
}

async function finishQuiz(){
  S.myDone=true;
  const compact=S.myAnswers.map(a=>({c:a.correct?1:0}));
  await dbUp('rooms/'+S.roomCode+'/'+S.role,{finished:true,score:S.score,answers:compact}).catch(()=>{});
  // Save wrong answers to spaced repetition
  const wrongQs=S.questions.filter((_,i)=>S.myAnswers[i]&&!S.myAnswers[i].correct&&!S.questions[i].isSR);
  if(wrongQs.length)saveSRQuestions(wrongQs);
  if(S.oppDone)runAnalysis();else{S.screen='waiting';render();}
}

function resetGame(){
  clearTimer();
  S.hintUsed=false;
  S.xpGained=0;S.newXp=0;S.leveledUp=0;
  S.screen='home';S.mode=null;S.submode='competitive';S.format='mixed';S.roomCode='';S.role='';
  S.questions=[];S.current=0;S.score=0;S.selected=null;
  S.myAnswers=[];S.myDone=false;
  S.oppName='';S.oppScore=0;S.oppDone=false;S.oppAnswers=[];S.oppUid='';
  S.eloChange=0;S.newElo=0;S.analysisReady=false;S.shieldJustEarned=false;S.analysisStarted=false;
  S.cefrResult=S.myProfile?.cefrResult||null;S.error=null;
}

// ═══════════════════════════════════════════════════
// AI QUESTION GENERATION
// ═══════════════════════════════════════════════════
async function genQ(diff,stats,srQs=[],fmt='mixed'){
  let weakHint='';
  if(stats){const wk=weakestCat(stats);const p=catPct(stats,wk);if(p!==null&&p<70)weakHint=`\nAlso include 1-2 extra questions on "${CATS[wk].label}" — player scores only ${p}% there.`;}
  // Inject due SR questions directly (replace up to 3 normal questions)
  let srHint='';
  if(srQs.length){
    srHint='\nIMPORTANT: The player previously got these questions wrong. Include them VERBATIM as questions in the set (same question text, options, correct index). For each repeated question, set the "srKeyword" field to the specific word, phrase or grammar point being tested (e.g. "give up", "present perfect", "on the contrary"): '+JSON.stringify(srQs.map(q=>({question:q.question,options:q.options,correct:q.correct,explanation:q.explanation,type:q.type,srKeyword:q.srKeyword||''})));
  }
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','x-api-key':S.ak,'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:
      `Generate exactly 10 multiple-choice English questions. Difficulty: ${diffHint(diff)}${weakHint}
${FORMATS[fmt]?.prompt||FORMATS.mixed.prompt}${srHint}
Return ONLY raw JSON no markdown: {"questions":[{"id":1,"type":"Phrasal Verbs","question":"...","options":["A","B","C","D"],"correct":0,"explanation":"...","example":"She gave up smoking after 10 years."}]}
Rules:
- type must be exactly "Phrasal Verbs", "Advanced Grammar", or "Vocabulary & Idioms"
- correct is 0-based index
- explanation MUST be in Slovak
- example is a short natural English sentence showing the correct answer in real context
- CRITICAL — answer quality rules:
  1. There must be ONE clearly correct answer. The other 3 options must be CLEARLY wrong — wrong grammar, wrong meaning, or wrong word entirely. NOT "almost correct but less formal".
  2. If the question is about register (formal/informal/neutral), you MUST explicitly state it in the question text, e.g. "In an INFORMAL conversation, which phrase..." or "In a FORMAL business email, which is correct..."
  3. Never create questions where multiple options could be defended as correct in any context.
  4. Distractors should be plausible but unambiguously incorrect — wrong tense, wrong preposition, non-existent phrase, or opposite meaning.`
    }]})
  });
  if(!res.ok){const t=await res.text();throw new Error('API '+res.status+': '+t);}
  const data=await res.json();
  const text=data.content?.find(b=>b.type==='text')?.text||'';
  const m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error('Neplatná odpoveď AI');
  const p=JSON.parse(m[0]);if(!p.questions?.length)throw new Error('Prázdne otázky');
  return p.questions;
}
